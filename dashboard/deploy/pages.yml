# GitHub Pages 배포 워크플로 (비활성 템플릿)
#
# 이 파일은 .github/workflows/ 밖에 있으므로 실행되지 않는다.
# 공개 승인 후에만 .github/workflows/pages.yml 로 복사해 사용한다. (dashboard/README.md 참고)
#
# 사이트에는 dashboard/ 안의 공개 파일 4개만 올린다.
#   index.html, styles.css, app.js, data/dashboard.json
# 트랙 폴더(report/, outbox/, data/, inbox/), answers/, new-data/, dashboard/tools/, dashboard/deploy/ 는 올리지 않는다.

name: Deploy dashboard to GitHub Pages

on:
  workflow_dispatch:   # 수동 실행만 허용 (push 자동 배포 없음)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check public data is up to date
        run: |
          python dashboard/tools/build_data.py --out "$RUNNER_TEMP/dashboard.json"
          if ! cmp -s "$RUNNER_TEMP/dashboard.json" dashboard/data/dashboard.json; then
            echo "dashboard/data/dashboard.json 이 최신 결과물과 다릅니다. build_data.py 로 다시 생성해 커밋하세요." >&2
            exit 1
          fi

      - name: Build site (dashboard public files only)
        run: |
          set -euo pipefail
          mkdir -p _site/data
          cp dashboard/index.html dashboard/styles.css dashboard/app.js _site/
          cp dashboard/data/dashboard.json _site/data/
          touch _site/.nojekyll
          find _site -type f | sort

      - name: Exposure check (personal data, employee IDs, unit prices, answers)
        run: python dashboard/tools/check_public.py _site --strict

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
