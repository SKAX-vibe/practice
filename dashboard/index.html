<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>실습 결과 대시보드</title>
  <meta name="description" content="바이브코딩 입문 실습 A·B·C·D 트랙 결과물(집계 · 보고서 · 검증 결과) 시각화">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>실습 결과 대시보드</h1>
          <p class="brand-sub">바이브코딩 입문 · 트랙별 결과물 · 모든 자료는 실습용 가상 데이터</p>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="mode-chip" id="modeChip" hidden></span>
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="화면 테마 전환">테마</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div id="modeBanner" class="mode-banner" role="note" hidden></div>

    <nav class="track-tabs" role="tablist" aria-label="트랙 선택" id="trackTabs"></nav>

    <div id="notice" class="notice" hidden></div>

    <section id="trackView" aria-live="polite">
      <div class="loading">불러오는 중…</div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      화면은 <code>data/dashboard.json</code> 한 파일만 읽습니다. 공개 사이트에는 가상 데모 데이터가, 내부 확인용에는 각 트랙 <code>report/</code>의 집계(개인 · 거래 단위 내역과 원문 제외, 대상 3명 미만 부서는 합산)가 들어갑니다. 현재 데이터 종류는 화면 상단에 표시됩니다.
    </div>
  </footer>

  <div id="tip" class="tip" role="tooltip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
